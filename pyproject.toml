[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wa-setpieces"
version = "0.25.0"
description = "Set-piece metrics, benchmarked team/player ratings, added-value scoring and mplsoccer pitch visualizations (penalties, kick-offs, free kicks, corners, throw-ins, goal kicks) from Opta and StatsBomb event data, including second phases, xT, zones and retention"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Waltzing Analytics" }]
keywords = ["football", "soccer", "opta", "statsbomb", "set-pieces", "sports-analytics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
]
viz = [
    "matplotlib>=3.6",
    "mplsoccer>=1.2",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-gallery>=0.15",
    "myst-parser",
    "matplotlib>=3.6",
    "mplsoccer>=1.2",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]
ml = [
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]
convert = [
    "pyarrow>=14",
]
xlsx = [
    "openpyxl>=3.1",
]

[project.scripts]
wa-setpieces = "wa_setpieces.cli:main"
wa-setpieces-convert-corners = "wa_setpieces.convert.corners:main"

[project.urls]
Homepage = "https://github.com/marclamberts/waltzinganalytics"
Documentation = "https://waltzinganalytics.readthedocs.io"
Repository = "https://github.com/marclamberts/waltzinganalytics"
Changelog = "https://waltzinganalytics.readthedocs.io/en/latest/changelog.html"
"Bug Tracker" = "https://github.com/marclamberts/waltzinganalytics/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wa_setpieces.ml" = ["models/*.pkl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["F"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
check_untyped_defs = true
